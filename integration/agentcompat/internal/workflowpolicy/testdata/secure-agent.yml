name: Secure Agent compatibility
on:
  pull_request:
concurrency: secure-agent-${{ github.ref }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: nezhahq/nezha
          ref: master
          path: nezha
          persist-credentials: false
      - run: go test ./integration/agentcompat/...
